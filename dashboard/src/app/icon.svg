<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glass-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="shield-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="32" height="32" rx="8" fill="#0f111a" />
  <rect width="30" height="30" x="1" y="1" rx="7" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Geometric Glass Prism / House Shield -->
  <!-- Top Roof Facet -->
  <path d="M16 5 L25 11 L16 17 L7 11 Z" fill="url(#glass-facet)" />
  
  <!-- Left Wall Facet -->
  <path d="M7 11 L16 17 L16 27 L7 21 Z" fill="url(#prism-grad)" />
  
  <!-- Right Wall Facet -->
  <path d="M16 17 L25 11 L25 21 L16 27 Z" fill="url(#shield-glow)" opacity="0.85" />
  
  <!-- Center Refraction Core Line -->
  <path d="M16 5 L16 27" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  <path d="M7 11 L25 11" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <circle cx="16" cy="17" r="2" fill="#ffffff" />
</svg>
